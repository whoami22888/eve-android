name: Manus Hybrid bridge tests
on:
  pull_request:
    paths: ['cloud_bridge/**', 'render.yaml', '.github/workflows/manus-hybrid-bridge.yml']
  push:
    branches: [main]
    paths: ['cloud_bridge/**', 'render.yaml', '.github/workflows/manus-hybrid-bridge.yml']
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r cloud_bridge/requirements.txt pytest
      - name: Test bridge
        run: |
          python -m compileall -q cloud_bridge
          PYTHONPATH=. python -m pytest -q cloud_bridge/tests
