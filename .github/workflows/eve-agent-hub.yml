name: Eve Agent Hub CI

on:
  pull_request:
  push:
    branches: [ main, feat/eve-agent-hub, fix/main-phase2-4-hardening ]

jobs:
  python-provider-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-android/app/src/main/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - name: Install Python runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q eve
      - name: Run provider and routing tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-android
    env:
      PYTHON_BIN: python3.11
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.15'
      - name: Verify Python executable
        run: |
          python3.11 --version
          python3.11 -c "import sys; print(sys.executable)"
      - name: Verify Chaquopy requirements path
        run: test -f app/src/main/python/requirements.txt
      - name: Set up Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('eve-android/**/*.gradle*', 'eve-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build and run Android unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Run Android lifecycle instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: cd eve-android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

  typescript-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pnpm 10.15.0
        run: npm install --global pnpm@10.15.0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run TypeScript typecheck
        run: pnpm run typecheck
