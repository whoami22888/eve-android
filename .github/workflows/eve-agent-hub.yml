name: Eve Agent Hub CI

on:
  pull_request:
  push:
    branches: [ main, feat/eve-agent-hub ]

jobs:
  python-provider-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-android/app/src/main/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run provider and routing tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          check-latest: true
      - name: Verify Python executable
        run: python3.11 --version
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('eve-android/**/*.gradle*', 'eve-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build and run Android unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
