name: Android Release Build

# Triggered on semantic version tags (e.g. v1.0.0).
# Requires five repository secrets:
#   EVE_KEYSTORE_BASE64   — base64-encoded keystore file
#   EVE_KEYSTORE_PATH     — (unused in CI; path derived at runtime)
#   EVE_KEYSTORE_PASSWORD — keystore store password
#   EVE_KEY_ALIAS         — signing key alias
#   EVE_KEY_PASSWORD      — signing key password
# Add these at: https://github.com/whoami22888/eve-android/settings/secrets/actions

on:
  push:
    tags:
      - 'v*'

jobs:
  build-signed-apk:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eve-android

    env:
      PYTHON_BIN: python3.11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python executable
        run: python3.11 --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('eve-android/**/*.gradle*', 'eve-android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Python unit tests
        working-directory: eve-android/app/src/main/python
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Decode keystore
        env:
          EVE_KEYSTORE_BASE64: ${{ secrets.EVE_KEYSTORE_BASE64 }}
        run: |
          echo "$EVE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eve.keystore"
          echo "EVE_KEYSTORE_PATH=$RUNNER_TEMP/eve.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          EVE_KEYSTORE_PASSWORD: ${{ secrets.EVE_KEYSTORE_PASSWORD }}
          EVE_KEY_ALIAS: ${{ secrets.EVE_KEY_ALIAS }}
          EVE_KEY_PASSWORD: ${{ secrets.EVE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signing
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying: $APK"
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: eve-release-${{ github.ref_name }}
          path: eve-android/app/build/outputs/apk/release/*.apk
          retention-days: 90
